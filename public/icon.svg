<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Surface -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Warm Amber Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Classic Location Pin Outline -->
  <path d="M 256,72 C 163,72 88,147 88,240 C 88,352 230,432 256,448 C 282,432 424,352 424,240 C 424,147 349,72 256,72 Z" fill="none" stroke="url(#pinGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Pin Circle Dot -->
  <circle cx="256" cy="240" r="56" fill="none" stroke="url(#pinGrad)" stroke-width="36" />
</svg>
